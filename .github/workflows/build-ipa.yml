name: Build iOS IPA (unsigned)

# 生成未签名 IPA，用 TrollStore / Sideloadly 安装。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 家庭账号长期令牌由仓库 Secret 注入，源码里不含
  EXPO_PUBLIC_FAMILY_TOKEN: ${{ secrets.FAMILY_TOKEN }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild（生成 ios 工程）
        run: npx expo prebuild -p ios --no-install
        env:
          CI: '1'

      - name: 补丁：@expo/ui 的 iOS 16.4 API 加可用性守卫（支持 iOS 16.0 部署目标）
        run: |
          python3 - <<'PY'
          import io
          p = 'node_modules/@expo/ui/ios/Modifiers/PresentationModifiers.swift'
          t = io.open(p, encoding='utf-8').read()
          NL = chr(10)
          old1 = NL.join([
            '  func body(content: Content) -> some View {',
            '    content.presentationCornerRadius(cornerRadius.map { CGFloat($0) })',
            '  }',
          ])
          new1 = NL.join([
            '  func body(content: Content) -> some View {',
            '    if #available(iOS 16.4, tvOS 16.4, *) {',
            '      content.presentationCornerRadius(cornerRadius.map { CGFloat($0) })',
            '    } else {',
            '      content',
            '    }',
            '  }',
          ])
          old2 = NL.join([
            '  func body(content: Content) -> some View {',
            '    if let shapeStyle = style?.toAnyShapeStyle() {',
            '      content.presentationBackground(shapeStyle)',
            '    } else {',
            '      content',
            '    }',
            '  }',
          ])
          new2 = NL.join([
            '  func body(content: Content) -> some View {',
            '    if #available(iOS 16.4, tvOS 16.4, *) {',
            '      if let shapeStyle = style?.toAnyShapeStyle() {',
            '        content.presentationBackground(shapeStyle)',
            '      } else {',
            '        content',
            '      }',
            '    } else {',
            '      content',
            '    }',
            '  }',
          ])
          assert old1 in t, 'pattern1 missing'
          assert old2 in t, 'pattern2 missing'
          t = t.replace(old1, new1).replace(old2, new2)
          io.open(p, 'w', encoding='utf-8').write(t)
          print('@expo/ui patched')

          PY

      - name: 补丁 Podfile：所有 Pod 的部署目标降到 16.0
        run: |
          python3 - <<'PY'
          import io
          p = 'ios/Podfile'
          t = io.open(p, encoding='utf-8').read()
          marker = 'post_install do |installer|'
          assert marker in t, 'post_install marker missing'
          NL = chr(10)
          inject = NL.join([
            marker,
            '  # [CI] 所有 Pod 统一降级部署目标（兼容 iOS 16.2 设备）',
            '  installer.pods_project.targets.each do |target|',
            '    target.build_configurations.each do |config|',
            "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'",
            '    end',
            '  end',
          ])
          t = t.replace(marker, inject, 1)
          io.open(p, 'w', encoding='utf-8').write(t)
          print('Podfile patched')
          PY

      - name: CocoaPods install
        working-directory: ios
        run: pod install --repo-update

      - name: 环境与工程信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ls ios
          xcodebuild -workspace ios/*.xcworkspace -list

      - name: 编译（不签名）
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WS" -list | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "workspace=$WS scheme=$SCHEME"
          set +e
          xcodebuild             -workspace "$WS" -scheme "$SCHEME"             -configuration Release -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             ARCHS=arm64 IPHONEOS_DEPLOYMENT_TARGET=16.0 > xcodebuild.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "==== 编译失败，关键错误 ===="
            grep -nE "error:|Error:|BUILD FAILED|The following build commands failed" -A3 xcodebuild.log | tail -120 || true
            echo "==== 最后 80 行 ===="
            tail -80 xcodebuild.log
            exit $rc
          fi
          tail -15 xcodebuild.log
      - name: 归一化所有 Mach-O 最低系统版本到 16.0（vtool）
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          export APP
          python3 - <<'PY'
          import os, struct, subprocess
          root = os.environ['APP']
          def patch(path):
              with open(path, 'rb') as f:
                  data = f.read()
              if len(data) < 32 or data[:4] not in (bytes([0xCF,0xFA,0xED,0xFE]), bytes([0xCE,0xFA,0xED,0xFE])):
                  return False
              ncmds = struct.unpack_from('<I', data, 16)[0]
              off = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', data, off)
                  if cmd == 0x32:
                      _, minos, sdk, _n = struct.unpack_from('<IIII', data, off + 8)
                      if minos > (16 << 16 | 2 << 8):
                          subprocess.run(['xcrun', 'vtool', '-set-build-version', 'ios', '16.0', '16.0', '-replace', '-output', path + '.vt', path], check=True)
                          os.replace(path + '.vt', path)
                          os.chmod(path, 0o755)
                          print('patched:', path, 'was', f'{minos>>16}.{(minos>>8)&0xff}')
                      return True
                  off += size
              return False
          for dirpath, _, files in os.walk(root):
              for n in files:
                  p = os.path.join(dirpath, n)
                  try:
                      patch(p)
                  except Exception as e:
                      print('skip', p, e)
          print('done')
          PY

      - name: 打包 IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -d "$APP"
          rm -rf Payload family-nas-ios.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry family-nas-ios.ipa Payload
          ls -lh family-nas-ios.ipa

      - name: 上传编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: 上传 IPA 到 Gitee 发行版（供 App 内更新）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('app.json'))['expo']['version'])")
          echo "版本: $VERSION"
          RID=$(curl -s "https://gitee.com/api/v5/repos/lazy-voice-jmy/family-nas/releases/tags/v$VERSION?access_token=$GITEE_TOKEN" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          if [ -z "$RID" ]; then echo "Gitee 上没有 v$VERSION 发行版，跳过"; exit 0; fi
          # 删除旧的同名 ipa 附件
          curl -s "https://gitee.com/api/v5/repos/lazy-voice-jmy/family-nas/releases/$RID/attach_files?access_token=$GITEE_TOKEN" | python3 -c "
          import json,sys
          for a in json.load(sys.stdin):
              if a['name'].endswith('.ipa'): print(a['id'])" | while read -r AID; do
            curl -s -X DELETE -o /dev/null "https://gitee.com/api/v5/repos/lazy-voice-jmy/family-nas/releases/$RID/attach_files/$AID?access_token=$GITEE_TOKEN"
          done
          curl -s --max-time 600 -X POST "https://gitee.com/api/v5/repos/lazy-voice-jmy/family-nas/releases/$RID/attach_files"             -F "access_token=$GITEE_TOKEN"             -F "file=@family-nas-ios.ipa;filename=family-nas-v$VERSION.ipa" -o gitee_ipa.json -w "上传 HTTP %{http_code}
"
          python3 -c "import json;print('IPA 地址:', json.load(open('gitee_ipa.json')).get('browser_download_url'))"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: family-nas-ios-ipa
          path: family-nas-ios.ipa

      - name: 更新 latest-ipa 发行版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-ipa >/dev/null 2>&1 || gh release create latest-ipa --title "latest IPA" --notes "家庭网盘 iOS 未签名 IPA（最新构建）"
          gh release upload latest-ipa family-nas-ios.ipa --clobber
